[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "svgbench"
version = "0.1.0"
description = "A benchmark measuring whether language models can resolve visual references in SVG markup that does not encode them."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.14"
authors = [{ name = "Nitish R G" }]
keywords = ["svg", "benchmark", "llm", "evaluation", "visual-grounding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Runtime dependencies are deliberately few. Every one of them is load-bearing:
#   pydantic    - config + data model validation; typed records are the contract
#                 between pipeline stages
#   pyyaml      - human-editable experiment configs
#   numpy       - geometry arithmetic and resampling-based inference
#   svgelements - ANALYTIC path geometry (pure Python)
#   resvg-py    - RASTER rendering (Rust). Deliberately a different implementation
#                 from svgelements so the two ground-truth witnesses are genuinely
#                 independent. See docs/adr/0004.
#   pillow      - decoding rendered PNGs into coverage masks
#   httpx       - local model HTTP client
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "numpy>=1.26,<3",
    "svgelements>=1.9,<2",
    "resvg-py>=0.1,<1",
    "pillow>=10,<13",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.6,<1",
    "mypy>=1.11,<2",
    "types-PyYAML>=6,<7",
]
report = ["matplotlib>=3.8,<4"]

[project.scripts]
svgbench = "svgbench.cli:main"

[project.urls]
Repository = "https://github.com/NITISH-R-G/svg-ambiguity-bench"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
svgbench = ["py.typed"]

# ---------------------------------------------------------------------------
# Tooling
# ---------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "slow: takes more than a second",
    "requires_model: needs a running local model server",
    "audit: leakage / blindness / determinism checks that gate publication",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "N",        # naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtin shadowing
    "C4",       # comprehensions
    "PT",       # pytest style
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
# NOTE: no blanket ignores. If a rule needs suppressing, suppress it at the line
# with a reason, so the exception is visible in review.

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["svgbench"]
strict = true
warn_unreachable = true
# Third-party libraries without type stubs. Listed individually rather than with
# a global ignore, so adding a new untyped dependency is a visible decision.
[[tool.mypy.overrides]]
module = ["svgelements.*", "resvg_py.*"]
ignore_missing_imports = true
