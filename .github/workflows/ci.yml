name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Both platforms: the corpus must hash identically on each, so a line-ending
        # or float-formatting difference has to fail here rather than silently produce
        # two "reproducible" datasets that disagree.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy

      - name: Test
        run: pytest

      # Audit checks gate publication: leakage, enhancement blindness, generation
      # determinism, design balance. They are marked so they can be run alone, and
      # they must never be allowed to fail quietly - the experiment still produces a
      # number when they break, it is just the wrong number.
      - name: Audit
        run: pytest -m audit
